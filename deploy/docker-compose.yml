# btcnode dashboard — two containers on the host network.
#
# Host network on purpose: bitcoind's RPC, electrs and the Prometheus port
# all listen on 127.0.0.1 and stay that way; nothing in bitcoin.conf has to
# be opened for a bridge. The web container is the only listener anyone
# else sees. Everything the api reads from the host is mounted read-only.
#
# The images come from GHCR, pinned by digest in .env (API_IMAGE, WEB_IMAGE).
# scripts/deploy-pull.sh writes those two lines, and only after cosign has
# checked that this repository's CI signed exactly those digests:
#
#   sudo bash ../scripts/deploy-pull.sh
#
# To build from the checkout instead, add docker-compose.build.yml. Without
# API_IMAGE/WEB_IMAGE the names fall back to the locally built ones.

services:
  api:
    image: ${API_IMAGE:-btcnode-api}
    container_name: btcnode-api
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: ${API_PORT:-3000}
      JOURNAL_DIR: ${JOURNAL_DIR:-/var/log/journal}
      BITCOIN_RPC_PASSWORD_FILE: /run/secrets/rpc_password
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      SESSION_KEY_FILE: /run/secrets/session_key
      AGENT_SOCKET: /run/btcnode-agent/agent.sock
      UPDATES_FILE: /var/lib/btcnode/updates.json
      # The host's unit files, mounted below — to tell "not installed" from "no access"
      SYSTEMD_UNIT_DIRS: /run/host/systemd/etc,/run/host/systemd/lib
    # Host groups: systemd-journal to read the journal, btcnode for the agent
    # socket, and — for a bitcoind in a container, whose debug.log is the log
    # source — the group that owns the data directory (65534 = nogroup when unset).
    group_add:
      - '${JOURNAL_GID:?set JOURNAL_GID in .env}'
      - '${AGENT_GID:?set AGENT_GID in .env}'
      - '${DATA_GID:-65534}'
    # /sys and /proc are visible inside a container anyway (temperature,
    # hwmon, CPU, memory, uptime are read from there); only these are mounted:
    volumes:
      # the host's journal, read-only — persistent or volatile, whichever the host uses
      - ${JOURNAL_DIR:-/var/log/journal}:${JOURNAL_DIR:-/var/log/journal}:ro
      # only for the disk-space figure (statfs); the chain data itself stays unreadable
      - ${BITCOIN_DATA_DIR:-/mnt/bitcoin/bitcoin}:${BITCOIN_DATA_DIR:-/mnt/bitcoin/bitcoin}:ro
      # the electrs onion hostname, copied there by the setup scripts
      - ${ELECTRS_CONF_DIR:-/etc/electrs}:/etc/electrs:ro
      # the host's systemd units, read-only: only their existence is checked
      - /etc/systemd/system:/run/host/systemd/etc:ro
      - /usr/lib/systemd/system:/run/host/systemd/lib:ro
      # the agent's socket — the one way to the host
      - /run/btcnode-agent:/run/btcnode-agent
      - btcnode-state:/var/lib/btcnode
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    image: ${WEB_IMAGE:-btcnode-web}
    container_name: btcnode-web
    network_mode: host
    restart: unless-stopped
    depends_on:
      - api
    environment:
      WEB_PORT: ${WEB_PORT:-443}
      HTTP_PORT: ${HTTP_PORT:-80}
      API_UPSTREAM: 127.0.0.1:${API_PORT:-3000}
    volumes:
      - ./certs:/etc/nginx/certs:ro
    # The image's entrypoint renders the templates into conf.d; nginx keeps
    # its pid in /run and its temp files in /var/cache/nginx.
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    # The master starts as root to bind 80 and 443, hands its temp
    # directories to the nginx user and switches the workers to it.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE

volumes:
  btcnode-state:
