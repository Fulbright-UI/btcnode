name: repro

# Reproducible builds: everything is built twice and compared. The
# JavaScript output file by file; the images layer by layer, each on a fresh
# builder without cache, with SOURCE_DATE_EPOCH from the commit as in the
# publish job. Weekly and whenever a Dockerfile or the lockfile changes; not
# a required check.
on:
  push:
    branches: [main, 'sam/**']
    paths:
      - deploy/Dockerfile.*
      - pnpm-lock.yaml
      - scripts/repro-*.sh
      - .github/workflows/repro.yml
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  js:
    name: repro js
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/repro-js.sh

  images:
    name: repro image ${{ matrix.image }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/repro-image.sh ${{ matrix.image }} epoch
