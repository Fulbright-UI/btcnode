name: codeql

# Static analysis of the TypeScript, the Python agent and the workflows.
# Results go to code scanning. On work branches the analysis runs without
# uploading, so a broken query or build shows up before main.
on:
  push:
    branches: [main, 'sam/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 3 * * 2'

permissions: {}

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && 'never' || 'always' }}
