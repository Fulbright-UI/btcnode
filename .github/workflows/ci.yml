name: ci

# Every branch and every pull request runs the same checks. The job names
# are what branch rules point at — rename a job and the rule has to follow.
#
# Third-party code is pinned: actions by commit SHA (the tag beside it is
# only a comment), images by digest. The workflow token gets nothing by
# default; each job asks for exactly what it uses.
on:
  push:
    branches: ['**']
  pull_request:

permissions: {}

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: pnpm check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter ./shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  agent-and-scripts:
    name: agent and scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest agent/tests/test_agent.py -v
      - run: for f in scripts/*.sh scripts/node-setup/*.sh; do bash -n "$f"; done
      - run: shellcheck -S warning scripts/*.sh
      - run: bash scripts/node-setup/tests/check.sh
      - run: bash scripts/node-setup/tests/tor-after-sync-test.sh

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rhysd/actionlint:1.7.12
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  images:
    name: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker build -f deploy/Dockerfile.api -t btcnode-api .
      - run: docker build -f deploy/Dockerfile.web -t btcnode-web .
