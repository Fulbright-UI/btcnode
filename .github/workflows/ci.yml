name: ci

# Every branch and every pull request runs the same checks. The job names
# are what branch rules point at — rename a job and the rule has to follow.
#
# Third-party code is pinned: actions by commit SHA (the tag beside it is
# only a comment), images by digest. The workflow token gets nothing by
# default; each job asks for exactly what it uses.
#
# Images are built for the Pi (linux/arm64) on GitHub's arm64 runners, on
# every branch. Only main and version tags publish them to GHCR — signed with
# cosign (keyless, the certificate names this workflow), with an SBOM and
# build provenance attached. scripts/deploy-pull.sh checks that signature on
# the Pi before it runs anything.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions: {}

# A newer push to the same branch makes the older run pointless — except on
# main and tags, where a run may be publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  node:
    name: pnpm check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter ./shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  agent-and-scripts:
    name: agent and scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest agent/tests/test_agent.py -v
      - run: for f in scripts/*.sh scripts/node-setup/*.sh; do bash -n "$f"; done
      - run: shellcheck -S warning scripts/*.sh
      - run: bash scripts/node-setup/tests/check.sh
      - run: bash scripts/node-setup/tests/tor-after-sync-test.sh

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rhysd/actionlint:1.7.12
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  images:
    name: image ${{ matrix.image }} (linux/arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish:
    name: publish ${{ matrix.image }}
    needs: [node, agent-and-scripts, workflows, images]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04-arm
    # The only job with write access: to the package, to the attestation
    # store, and an OIDC token for the keyless signature.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    env:
      IMAGE: ghcr.io/fulbright-ui/btcnode-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit's own SBOM (SPDX) and provenance, stored in the image index
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: sign with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      # The same check the Pi runs before it deploys (scripts/deploy-pull.sh).
      - name: verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign verify "$IMAGE@$DIGEST"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          --certificate-identity-regexp
          '^https://github\.com/Fulbright-UI/btcnode/\.github/workflows/ci\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$'
          > /dev/null
      - name: SBOM of the pushed image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # storage records exist for organisation-owned repositories only
          create-storage-record: false
      - name: summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### $IMAGE"
            echo
            echo "digest: \`$DIGEST\`"
            echo
            echo "tags:"
            while read -r tag; do echo "- $tag"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
