name: release

# Publishes a GitHub release for a version tag. The notes are the tag's
# section of CHANGELOG.md. Assets: the source archive and a checksum file,
# each with a Sigstore bundle from cosign (keyless, this workflow's identity).
# Images for the tag are built and signed by ci.yml.
#
# Check an asset:
#   cosign verify-blob --bundle FILE.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/Fulbright-UI/btcnode/\.github/workflows/release\.yml@' FILE
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: existing version tag, for example v4.0.0
        required: true

permissions: {}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || { echo "no CHANGELOG section for $version"; exit 1; }
      - name: assets
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="btcnode-${TAG#v}/" -o "dist/btcnode-${TAG#v}.tar.gz" HEAD
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: sign the assets (keyless)
        run: |
          for f in dist/*.tar.gz dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file notes.md dist/*
